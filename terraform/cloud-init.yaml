#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose
  - git

runcmd:
  # Move real SSH to 2222
  - sed -i 's/#Port 22/Port 2222/' /etc/ssh/sshd_config
  - systemctl restart sshd
  # Deploy Honeypot
  - git clone https://github.com/yourusername/HoneyRoot-X.git /opt/HoneyRoot-X
  - cd /opt/HoneyRoot-X
  - docker-compose up -d
