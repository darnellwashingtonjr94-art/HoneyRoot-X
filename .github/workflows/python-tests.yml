name: Python Lint and Testname: Python Lint and Test

on:
  pull_request:
    branches: [ "main" ]
  # Adding push triggers the workflow immediately without needing a PR
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs project-specific dependencies (like cryptography) missing from the original workflow
        pip install -r requirements.txt
        pip install flake8 pytest paramiko

    - name: Prepare Log Directory
      run: |
        # Fixes Blocker 1: Creates the hardcoded directory and grants the runner ownership
        sudo mkdir -p /opt/honeyroot/logs
        sudo chown -R $USER:$USER /opt/honeyroot

    - name: Lint with flake8
      run: |
        flake8 core/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest
      env:
        # Fixes Blocker 2: Adds 'core' to the Python path so implicit imports resolve correctly
        PYTHONPATH: core
      run: |
        pytest tests/
