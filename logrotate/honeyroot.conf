/opt/honeyroot/logs/honeypot.json {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    postrotate
        # Signal the python script to reopen the file handle if necessary
        # (Though our Python logger opens in append mode per-write, so this is safe)
    endscript
}
